spring.application.name=webdev2
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/webdev2_week8
spring.datasource.username=vetclinic_app
spring.datasource.password=your_app_db_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

app.seed.reader-username=clinic_viewer
app.seed.reader-password=replace_with_local_reader_password
app.seed.manager-username=clinic_manager
app.seed.manager-password=replace_with_local_manager_password
