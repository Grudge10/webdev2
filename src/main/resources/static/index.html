<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Clinic Directory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Vet Clinic Pets</h1>

        <section class="card">
            <h2>Pet List</h2>
            <form id="filter-form" class="row">
                <input id="species-input" type="text" placeholder="Filter by species (e.g. Dog)">
                <button type="submit">Filter</button>
                <button type="button" id="reset-btn">Reset</button>
            </form>

            <p id="pets-status" class="status"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Species</th>
                        <th>Owner</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pets-body"></tbody>
            </table>

            <div class="row pager">
                <button type="button" id="prev-btn">Prev</button>
                <span id="page-info">Page 1 of 1</span>
                <button type="button" id="next-btn">Next</button>
            </div>
        </section>

        <section class="card">
            <h2>Pet Detail</h2>
            <form id="lookup-form" class="row">
                <input id="pet-id-input" type="number" min="1" placeholder="Enter Pet ID (e.g. 1 or 999)">
                <button type="submit">Find</button>
            </form>
            <p id="detail-status" class="status">Select a pet or enter an ID.</p>
            <div id="pet-detail"></div>
        </section>

        <section class="card">
            <h2>Owners</h2>
            <p id="owners-status" class="status"></p>
            <ul id="owners-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
