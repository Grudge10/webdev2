spring.application.name=webdev2
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/webdev2_week8}
spring.datasource.username=${DB_USERNAME:vetclinic_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

app.seed.reader-username=${APP_SEED_READER_USERNAME:}
app.seed.reader-password=${APP_SEED_READER_PASSWORD:}
app.seed.manager-username=${APP_SEED_MANAGER_USERNAME:}
app.seed.manager-password=${APP_SEED_MANAGER_PASSWORD:}
