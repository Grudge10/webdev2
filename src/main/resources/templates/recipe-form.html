<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Recipe Form</title>
  </head>
  <body>
    <h1 th:text="${recipe.id == null} ? 'Add New Recipe' : 'Edit Recipe'">
      Recipe Form
    </h1>

    <form
      th:action="${recipe.id == null} ? @{/recipes} : @{/recipes/{id}(id=${recipe.id})}"
      th:object="${recipe}"
      method="post"
    >
      <label>Name: </label>
      <input type="text" th:field="*{name}" />
      <span th:errors="*{name}" style="color: red"></span>
      <br /><br />

      <label>Prep Time (minutes): </label>
      <input type="number" th:field="*{prepTimeMinutes}" />
      <span th:errors="*{prepTimeMinutes}" style="color: red"></span>
      <br /><br />

      <label>Servings: </label>
      <input type="number" th:field="*{servings}" />
      <span th:errors="*{servings}" style="color: red"></span>
      <br /><br />

      <label>Description: </label><br />
      <textarea th:field="*{description}" rows="4" cols="50"></textarea>
      <br />
      <span th:errors="*{description}" style="color: red"></span>
      <br /><br />

      <button type="submit">Save Recipe</button>
      <a href="/recipes">Cancel</a>
    </form>
  </body>
</html>
